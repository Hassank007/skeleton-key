    <script>
      // Tab on the last button goes back to the middle one, and Shift+Tab on the middle one goes to the last.
      document.getElementById('box').addEventListener('keydown', function (event) {
        if (event.key !== 'Tab') return
        var two = document.getElementById('two')

          event.preventDefault()
          two.focus()
        } else if (event.shiftKey && document.activeElement === two) {
          event.preventDefault()
          three.focus()
        }
      })
